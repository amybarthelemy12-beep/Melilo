version: "3.9"

services:
  app:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    working_dir: /app
    command: ["bash", "-lc", "python scripts/validate_env.py --env-file .env && python -m compileall scripts melilo"]
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
